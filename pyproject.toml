[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-database"
version = "1.0.0"
requires-python = ">=3.12"
description = "Private Garmin wellness archive and desktop viewer"
dependencies = ["fitdecode==0.11.0", "garmin-fit-sdk==21.218.0", "garminconnect==0.3.17", "tzdata==2026.5", "PySide6-Essentials==6.12.0"]

[project.scripts]
garmin-db = "garmin_database.cli:main"

[project.gui-scripts]
garmin-database = "garmin_database.ui:main"

[tool.setuptools.packages.find]
include = ["garmin_database*"]

[tool.setuptools.package-data]
garmin_database = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["unit: fast isolated rules", "integration: database and archive pipeline", "ui: desktop interaction"]

[tool.coverage.run]
source = ["garmin_database"]
omit = ["garmin_database/ui.py", "garmin_database/chart.py", "garmin_database/icons.py", "garmin_database/__main__.py"]

[tool.coverage.report]
show_missing = true
